[project]
name = "compdam-cai"
version = "0.2.0"
description = "Standalone Abaqus/Explicit Compression-After-Impact model generator for the NASA CompDam_DGD VUMAT"
readme = "README.md"
license = { text = "NASA Open Source Agreement (see repository LICENSE.txt)" }
# The generator itself has no dependencies and also runs on Python 2.7
# (e.g. "abaqus python" of Abaqus 2023). This environment is for the unit
# tests and documentation.
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.4",
]
docs = [
    "sphinx>=7.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
